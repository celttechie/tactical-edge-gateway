apiVersion: apps/v1
kind: Deployment
metadata:
  name: tactical-edge-gateway
  namespace: tactical-edge
  labels:
    app.kubernetes.io/name: tactical-edge-gateway
    app.kubernetes.io/part-of: tactical-edge-gateway
    app.kubernetes.io/version: "0.1.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tactical-edge-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tactical-edge-gateway
        app.kubernetes.io/part-of: tactical-edge-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: tactical-edge-gateway:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: gateway-config
          ports:
            - name: mavlink-udp
              containerPort: 14550
              protocol: UDP
            - name: cot-udp
              containerPort: 4242
              protocol: UDP
          volumeMounts:
            - name: data-volume
              mountPath: /data
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - import tactical_edge_gateway; print('liveness-ok')
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - import tactical_edge_gateway; print('readiness-ok')
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
      volumes:
        - name: data-volume
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
