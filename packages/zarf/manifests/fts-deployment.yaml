apiVersion: apps/v1
kind: Deployment
metadata:
  name: freetakserver
  namespace: tactical-edge
  labels:
    app.kubernetes.io/name: freetakserver
    app.kubernetes.io/part-of: tactical-edge-gateway
    app.kubernetes.io/version: "latest"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: freetakserver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: freetakserver
        app.kubernetes.io/part-of: tactical-edge-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: freetakserver
          image: ghcr.io/freetakteam/freetakserver:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: cot-tcp
              containerPort: 8087
              protocol: TCP
            - name: cot-tls
              containerPort: 8089
              protocol: TCP
            - name: fts-rest
              containerPort: 19023
              protocol: TCP
          volumeMounts:
            - name: fts-data
              mountPath: /opt/fts/data
            - name: tmp-volume
              mountPath: /tmp
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      volumes:
        - name: fts-data
          emptyDir: {}
        - name: tmp-volume
          emptyDir: {}
