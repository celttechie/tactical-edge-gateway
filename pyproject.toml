[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-edge-gateway"
version = "0.1.0"
description = "Air-gapped resilient tactical telemetry gateway bridging MAVLink, ROS2, and NetworkTables autonomy streams to Cursor on Target (CoT) and TAK Server"
authors = [
    { name = "Brian Jarrett", email = "celttechie@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.30",
    "pydantic>=2.0.0",
    "cryptography>=41.0.0",
    "xmltodict>=0.13.0",
]

[project.optional-dependencies]
robotpy = [
    "pyntcore>=2024.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
]

[project.scripts]
tactical-edge-gateway = "tactical_edge_gateway.main:main"

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=tactical_edge_gateway --cov-report=term-missing"
