[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tactical-edge-gateway"
version = "0.1.0"
description = "Air-gapped resilient tactical telemetry gateway bridging MAVLink and ROS2 autonomy streams to Cursor on Target (CoT) and TAK Server"
authors = [
    { name = "Brian Jarrett", email = "celttechie@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pymavlink>=2.4.30",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "cryptography>=41.0.0",
    "xmltodict>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "isort>=5.12.0",
    "pre-commit>=3.5.0",
    "bandit[toml]>=1.7.5",
    "pip-audit>=2.6.0",
]

[project.scripts]
tactical-edge-gateway = "tactical_edge_gateway.main:main"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # Allow assert statements in tests if ever scanned

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=tactical_edge_gateway --cov-report=term-missing"

[tool.pyright]
include = ["src", "tests", "scripts"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
